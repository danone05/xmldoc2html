[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmldoc2html"
version = "0.1.0"
description = "Convert simple XML documents to HTML"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
xmldoc2html = "xmldoc2html.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
