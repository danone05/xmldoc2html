<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XML to HTML</title>
</head>
<body>
<h1>XML to HTML</h1>
<section>
<h2>Introduction</h2>
<p>This is a simple <strong>XML</strong> document converted to <em>HTML</em> .</p>
<p>Visit <a href="https://example.com">Example Website</a></p>
</section>
<section>
<h2>Features</h2>
<ul>
  <li>Paragraph support</li>
  <li>Bold and italic text</li>
  <li>Links</li>
  <li>Lists</li>
  <li>sections</li>
</ul>
<section>
<h3>Example</h3>
<p>Example inline code: <code>print(&quot;Hello World&quot;)</code></p>
<p>First line<br>Second line</p>
</section>
<section>
<h3>Introduction</h3>
<p>Hello <strong>world</strong></p>
<img src="images/logo.png" alt="logo">
</section>
</section>
</body>
</html>
